schema: 1
story: '6.2'
story_title: 'Declarar dependências e garantir instalação limpa reproduzível'
gate: CONCERNS
status_reason: >-
  Manifesto auditado e corrigido com evidência verificável (auditoria de imports e pisos de
  versão reproduzidos de forma independente), mas os pisos legados de streamlit/dnspython
  ainda admitem versões com vulnerabilidades conhecidas e a AC4 permanece parcial (comando
  literal `streamlit run` continua quebrado e falta a reprodução por segunda pessoa).
reviewer: 'Quinn (@qa)'
reviewed_revision: 'commit:1be4334'
updated: '2026-09-09T00:00:00Z'

top_issues:
  - id: 'SEC-001'
    severity: medium
    category: security
    finding: >-
      Os pisos pré-existentes não foram reavaliados quanto a vulnerabilidades. Consulta OSV.dev
      no piso declarado: `streamlit>=1.30.0` admite 6 vulnerabilidades conhecidas, entre elas
      GHSA-7p48-42j8-8846 (SSRF não autenticado com exposição de credencial NTLM no Windows,
      corrigido em 1.54.0) e GHSA-rxff-vr5r-8cj5 (path traversal no Windows, corrigido em 1.37.0)
      — o ambiente-alvo declarado no README é justamente Windows. `dnspython>=2.5.0` admite
      GHSA-3rq5-2g8h-59hc / PYSEC-2026-1307 (DoS via mecanismo Tudoor, corrigido em 2.6.1).
      Os pisos adicionados nesta story (numpy, scikit-learn, rapidfuzz, pandas) estão limpos no OSV.
    suggested_action: >-
      Elevar `streamlit` para `>=1.54.0` e `dnspython` para `>=2.6.1`. Risco atualmente latente
      (um `pip install` hoje resolve para streamlit 1.63.0 / dnspython 2.8.0), materializa-se
      quando o resolver for restringido por Python mais antigo, constraints ou lockfile.
  - id: 'REQ-001'
    severity: medium
    category: requirements
    finding: >-
      A AC4 exige, literalmente, `pip install -r <manifesto>` seguido de `streamlit run`. O comando
      literal continua quebrando com `ModuleNotFoundError: No module named 'src'` em instalação
      limpa. Diagnóstico do @dev confirmado de forma independente na fonte do venv
      (`streamlit.web.bootstrap._fix_sys_path` faz apenas `sys.path.insert(0, os.path.dirname(main_script_path))`,
      inserindo `src/` e nunca a raiz). Não é defeito de manifesto, e a correção exigiria mexer em
      código de aplicação (fora do escopo). Resolvido por documentação (`python -m streamlit run src/app.py`),
      mas o débito residual foi apenas citado nas Completion Notes, sem item rastreável em backlog.
    suggested_action: >-
      Registrar o item de path/empacotamento (`pyproject.toml` ou bootstrap de `sys.path`) como
      backlog explícito para a Story 6.1/6.3 — a 6.3 esbarrará no mesmo tema ao rodar `pytest`
      a partir da raiz. Manter a documentação atual como mitigação no ínterim.
  - id: 'REQ-002'
    severity: low
    category: requirements
    finding: >-
      Cláusula final da AC4 — "O procedimento é documentado e reproduzido por outra pessoa que não
      a autora" — não satisfeita. O @dev declarou explicitamente a limitação (não pode ser cumprida
      por um agente); o procedimento está documentado ponta a ponta no README §5.
    suggested_action: >-
      Atestação humana pendente: uma segunda pessoa deve executar o README §5 em clone limpo antes
      do fechamento definitivo do Epic 6. Não bloqueia o push desta story.
  - id: 'MNT-001'
    severity: low
    category: code
    finding: >-
      Divergência entre o mínimo declarado e o mínimo testado. O README declara suporte a
      "Python 3.11 a 3.14" e o manifesto declara `pandas>=2.3.3` (linha pandas 2.x), mas a validação
      funcional (AC4) ocorreu somente em Python 3.14.3 com pandas 3.0.5 — uma major diferente.
      O CI em 3.11 executa apenas `flake8`, sem nenhum teste funcional, então o piso declarado nunca
      é exercitado de fato.
    suggested_action: >-
      Após a Story 6.3, rodar a baseline de testes em matriz (3.11 e 3.14) no CI, ou reduzir a
      afirmação de suporte do README ao que foi efetivamente exercitado.
  - id: 'TEST-001'
    severity: low
    category: tests
    finding: >-
      Não há regressão automatizada para o que esta story corrige — a evidência da AC4 é um script
      ad-hoc de `streamlit.testing.v1.AppTest` executado uma vez, não versionado no repositório.
    suggested_action: >-
      Esperado e aceito: a baseline de testes é o objeto da Story 6.3, cujo smoke test de import
      (6.3 AC4) se tornará a regressão desta story. Sem ação nesta story.

