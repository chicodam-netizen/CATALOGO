evidence_verification:
  independent_checks_performed:
    - check: 'Auditoria de imports refeita do zero'
      method: 'grep -rnE "^\s*(import|from)\s+" src/ --include="*.py" sobre os 9 arquivos .py'
      result: >-
        Bate exatamente com a tabela do Dev Agent Record. Terceiros = streamlit, pandas, sqlalchemy,
        numpy, sklearn, rapidfuzz, dns.resolver. `openpyxl` confirmado como engine de runtime em
        src/app.py:136 e 194 (`pd.ExcelWriter(..., engine='openpyxl')`), sem import — declaração
        correta. `pyodbc` aparece apenas como texto de help em src/app.py:25, nunca importado —
        exclusão correta pela AC6. Discrepâncias remanescentes: 0.
    - check: 'Plausibilidade dos pisos de versão (wheel win_amd64) — solicitado explicitamente'
      method: 'Consulta à API JSON do PyPI por release, contando wheels cp314-*-win_amd64'
      result: >-
        CONFIRMADO em todos os quatro casos, incluindo o teste negativo (a release imediatamente
        anterior não tem wheel): numpy 2.3.2 = 1 wheel / 2.3.1 = 0 (requires_python >=3.11);
        scikit-learn 1.7.2 = 1 / 1.7.1 = 0; rapidfuzz 3.14.0 = 1; pandas 2.3.3 = 1 / 2.3.2 = 0.
        Cada piso declarado é, de fato, a primeira release com wheel binária cp314-win_amd64.
        A evidência documentada pelo @dev é genuína, não uma afirmação sem lastro.
    - check: 'Resolubilidade do manifesto no ambiente de CI (Linux + cp311)'
      method: 'Enumeração de wheels cp311 linux x86_64 por release no PyPI'
      result: >-
        Resolve com wheels binárias: pandas 3.0.5, numpy 2.4.6 (a maior numpy que ainda publica
        cp311 — 2.5.x exige >=3.12), scikit-learn 1.9.0, rapidfuzz 3.14.6. Coincide exatamente com o
        dry-run reportado pelo @dev no item 7 do Debug Log. O CI ajustado para 3.11 não quebra.
    - check: 'Causa raiz da quebra de `streamlit run`'
      method: 'inspect.getsource(streamlit.web.bootstrap._fix_sys_path) no venv do projeto'
      result: >-
        Confirmado literalmente: `sys.path.insert(0, os.path.dirname(main_script_path))`. Insere
        apenas `src/`, jamais a raiz. O diagnóstico do @dev está correto e não é defeito de manifesto.
    - check: 'Import morto de rapidfuzz'
      method: 'flake8 src --exit-zero'
      result: >-
        `F401 rapidfuzz.fuzz imported but unused` (2 ocorrências) — corrobora de forma independente
        a decisão "RESOLVIDO — AC1 × AC6": o pacote é executado no carregamento do módulo e precisa
        estar declarado, e a remoção do import é escopo da Story 6.1. Decisão do @po aplicada
        corretamente, com o comentário de rastreio presente no manifesto.
    - check: 'Indisponibilidade do CodeRabbit'
      method: "wsl bash -c 'echo wsl-ok'"
      result: '`/bin/sh: bash: not found` — degradação graciosa do item 9 do Debug Log confirmada.'
    - check: 'Renomeação sem resíduo (AC3)'
      method: 'git show do diff + listagem da raiz'
      result: >-
        `requirements.txt` deletado, `requirements-aiox-tooling.txt` criado com conteúdo preservado
        + cabeçalho. Nenhum `requirements.txt` remanescente na raiz. `ci.yml:29` consome
        `requirements_catalog.txt`. Um único manifesto de aplicação.

